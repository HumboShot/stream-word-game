<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AFK Word Game</title>
    <link rel="stylesheet" href="../shared/share-tech-mono.css">
    <link rel="stylesheet" href="afk-word-game.css">
</head>

<body>

    <div id="layout-game" class="layout">
        <div id="intro">
            <div class="intro-title">AFK WORD GAME</div>
            <ol class="intro-rules">
                <li>Emotes pop up on the screen.</li>
                <li>Type the emote's name in chat.</li>
                <li>The first one to type it gets <span class="intro-points">100</span> points.</li>
                <li class="intro-late">Too slow? Type it within <span class="intro-late-seconds">5</span> seconds
                    for up to <span class="intro-points intro-late-points">50</span>.</li>
            </ol>
            <div class="intro-starts">FIRST EMOTE IN</div>
            <div class="intro-countdown"></div>
            <div class="intro-footer">Results go to chat when I'm back.</div>
        </div>
        <div id="word-display" class="is-hidden"></div>
    </div>

    <div id="streamerbot-status" class="status-badge">
        <span class="status-icon">⚠</span>
        <span class="status-text">STREAMER.BOT DISCONNECTED</span>
    </div>

    <script src="../shared/streamerbot-client.js"></script>
    <script src="../shared/secrets.local.js"></script>
    <script src="afk-word-game.js"></script>
    <script src="afk-word-game.config.js"></script>

</body>

</html>
